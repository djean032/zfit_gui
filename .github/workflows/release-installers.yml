name: Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Standard executable
        shell: cmd
        run: scripts\build_pyinstaller_standard.bat

      - name: Build Lab executable
        shell: cmd
        run: scripts\build_pyinstaller_lab.bat

      - name: Build installers
        shell: cmd
        run: scripts\build_installers.bat

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash dist/installers/ZScanStudio-Standard-Setup.exe -Algorithm SHA256 | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), "ZScanStudio-Standard-Setup.exe" } | Set-Content dist/installers/SHA256SUMS.txt
          Get-FileHash dist/installers/ZScanStudio-Lab-Setup.exe -Algorithm SHA256 | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), "ZScanStudio-Lab-Setup.exe" } | Add-Content dist/installers/SHA256SUMS.txt

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installers/ZScanStudio-Standard-Setup.exe
            dist/installers/ZScanStudio-Lab-Setup.exe
            dist/installers/SHA256SUMS.txt
          generate_release_notes: true
